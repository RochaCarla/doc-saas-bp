name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material==9.7.7" "mkdocs-print-site-plugin==2.9"

      - name: Build site
        run: mkdocs build --strict

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Gera o e-book a partir de site/print_page/. Não bloqueia o deploy do site.
      - name: Generate PDF (e-book)
        continue-on-error: true
        run: |
          npm install --no-save --prefix .pdf puppeteer@25.12.0 pdf-lib@1.17.1
          NODE_PATH=.pdf/node_modules DOC_VERSION="${GITHUB_SHA::7}" \
            node scripts/gerar_pdf.cjs site site/documentacao-brasil-participativo-saas.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
